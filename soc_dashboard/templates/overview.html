<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/*__CSS__*/
/* Overview: one row per project, same columns as each project's KPI strip, so projects compare down a column. */
.portfolio { min-width: 860px; }
.portfolio td { vertical-align: middle; padding-block: 12px; }
.portfolio a.proj { white-space: nowrap; font: 600 1.05rem var(--font-display); color: var(--ink); text-decoration: none; }
.portfolio a.proj:hover { color: var(--accent); text-decoration: underline; }
.portfolio .big { font: 600 1.25rem/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.portfolio .small { font-size: .76rem; color: var(--muted); }
.portfolio svg { display: block; width: 96px; height: 24px; }
.portfolio tr.err td { background: var(--fail-soft); }
.rate-cell { display: flex; align-items: center; gap: 10px; }
.gaps { font-size: .76rem; color: var(--muted); margin-top: 3px; }
.counts { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: .9rem; color: var(--muted); }
.owners-x td { padding-block: 9px; }
.owners-x tr.grp td { border-top: 2px solid var(--line); }
.owners-x .who { font: 600 1rem var(--font-display); }
.counts b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
<!--BODY-->
<main class="wrap">
  <header class="top">
    <div style="display:grid;gap:6px">
      <span class="label">SoC verification</span>
      <h1 id="title"></h1>
      <div class="counts" id="counts"></div>
    </div>
    <div class="top-actions" id="top-actions"></div>
  </header>

  <section class="band" id="projects-band">
    <div class="band-head"><h2>Projects</h2><p>Each row is the project's whole SoC in its latest run. Open a project for block-level detail.</p></div>
    <div class="panel">
      <div class="scroll"><table class="portfolio" id="portfolio"></table></div>
    </div>
  </section>

  <section class="band" id="owners-band" hidden>
    <div class="band-head"><h2>Owners</h2><p id="own-note"></p></div>
    <div class="panel">
      <div class="scroll"><table class="portfolio owners-x" id="owners"></table></div>
    </div>
  </section>

  <footer id="footer"></footer>
</main>

<script type="application/json" id="socdash-data">__SOCDASH_DATA__</script>
<script>
(function () {
  "use strict";
/*__VIZ__*/
  var D = JSON.parse(document.getElementById("socdash-data").textContent);
  var SVGNS = "http://www.w3.org/2000/svg";
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function pct(x, d) { return x == null ? "–" : (100 * x).toFixed(d == null ? 1 : d) + "%"; }
  function days(a, b) { return Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 864e5); }

  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function shortDate(iso) { var p = iso.split("-"); return MON[+p[1] - 1] + " " + (+p[2]); }
  var FC_TEXT = { met: "Met", on_track: "On track", at_risk: "At risk", stalled: "Stalled", projected: "Projected", unknown: "No forecast" };
  function fcPill(f) {
    if (!f) return "";
    var tip = f.status === "met" ? "Last three runs average at or above the bar" : f.status === "stalled" ? "Pass rate is not improving over recent runs"
      : f.eta ? "Trend reaches the bar around " + f.eta + (f.due ? "; due " + f.due : "") : "Not enough runs to project";
    return "<span class=\"fc " + f.status + "\" style=\"margin-top:4px\" title=\"" + esc(tip) + "\">" + (FC_TEXT[f.status] || f.status) + (f.eta && f.status !== "met" ? " · " + shortDate(f.eta) : "") + "</span>";
  }

  function renderOwners() {
    var rows = D.owners || [];
    $("owners-band").hidden = !rows.length;
    if (!rows.length) return;
    rows = rows.slice().sort(function (a, b) { return a.owner.toLowerCase() < b.owner.toLowerCase() ? -1 : a.owner.toLowerCase() > b.owner.toLowerCase() ? 1 : a.project < b.project ? -1 : 1; });
    var h = "<thead><tr><th>Owner</th><th>Project</th><th>Tests passing this week</th><th>Weekly target</th><th class=\"r\">New fails</th><th class=\"r\">Fixed</th><th>Longest failing</th><th class=\"r\">Open bugs</th><th>Forecast</th></tr></thead><tbody>";
    var prev = null, met = 0, withT = 0, people = {};
    rows.forEach(function (r) {
      var d = r.tp_e - r.tp_s; people[r.owner] = 1;
      if (r.target != null) { withT++; if (r.tp_e >= r.target) met++; }
      h += "<tr" + (r.owner !== prev && prev !== null ? " class=\"grp\"" : "") + "><td>" + (r.owner !== prev ? "<span class=\"who\">" + esc(r.owner) + "</span>" : "") + "</td>" +
        "<td><a class=\"proj\" style=\"font-size:.92rem\" href=\"" + esc(r.href) + "\">" + esc(r.project) + "</a><div class=\"small\">week ending " + esc(shortDate(r.week_end)) + "</div></td>" +
        "<td class=\"num\">" + (r.first_week ? "" : "<span class=\"muted\">" + r.tp_s + " → </span>") + "<b>" + r.tp_e + "</b><span class=\"muted\"> / " + r.ran_e + "</span>" + (r.first_week ? "" : " <span class=\"" + (d > 0 ? "up" : d < 0 ? "down" : "muted") + "\">" + (d >= 0 ? "+" : "−") + Math.abs(d) + "</span>") + "</td>" +
        "<td>" + (r.target == null ? "<span class=\"muted\">–</span>" : "<span class=\"pill " + (r.tp_e >= r.target ? "ok" : r.tp_e >= r.target - 2 ? "warn" : "bad") + "\">" + r.tp_e + " / " + r.target + "</span>") + "</td>" +
        "<td class=\"r " + (r.new_fail ? "down" : "muted") + "\">" + r.new_fail + "</td><td class=\"r " + (r.fixed ? "up" : "muted") + "\">" + r.fixed + "</td>" +
        "<td>" + (r.oldest ? "<b class=\"num" + (r.stuck ? " down" : "") + "\">" + r.oldest.days + "d</b> <span class=\"mono\" style=\"font-size:.78rem\">" + esc(r.oldest.test) + "</span>" : "<span class=\"muted\">none</span>") + "</td>" +
        "<td class=\"r num\">" + r.bug_unresolved + "</td><td>" + fcPill(r.forecast) + "</td></tr>";
      prev = r.owner;
    });
    $("owners").innerHTML = h + "</tbody>";
    $("own-note").textContent = Object.keys(people).length + " people across " + D.projects.filter(function (p) { return !p.error; }).length + " projects, latest week of each." + (withT ? " " + met + " of " + withT + " weekly targets met." : "");
  }


  var today = D.generated.slice(0, 10);
  var ok = D.projects.filter(function (p) { return !p.error && p.met; }).length;
  var bad = D.projects.filter(function (p) { return p.error; }).length;
  var s1 = D.projects.reduce(function (n, p) { return n + (p.bugs ? p.bugs.S1 : 0); }, 0);
  $("title").textContent = D.title;
  $("counts").innerHTML = "<span><b>" + D.projects.length + "</b> project" + (D.projects.length === 1 ? "" : "s") + "</span>" +
    "<span><b>" + ok + "</b> meeting their next milestone</span>" +
    "<span><b>" + s1 + "</b> unresolved S1 bug" + (s1 === 1 ? "" : "s") + "</span>" +
    (bad ? "<span><b>" + bad + "</b> with unreadable inputs</span>" : "");

  var h = "<thead><tr><th>Project</th><th>Next milestone</th><th>Sim pass rate and forecast</th><th class=\"r\">Coverage at target</th><th class=\"r\">S1 / S2 open</th><th class=\"r\">Testplan passing</th><th>Latest run</th></tr></thead><tbody>";
  D.projects.forEach(function (p) {
    if (p.error) {
      h += "<tr class=\"err\"><td><span class=\"proj\" style=\"font:600 1.05rem var(--font-display)\">" + esc(p.name) + "</span></td><td colspan=\"6\"><span class=\"pill bad\">inputs could not be read</span><div class=\"gaps sig\">" + esc(p.error) + "</div></td></tr>";
      return;
    }
    var age = days(p.latest_date, today), stale = age > p.stale_after_days;
    h += "<tr>" +
      "<td><a class=\"proj\" href=\"" + esc(p.href) + "\">" + esc(p.name) + "</a><div class=\"small\">" + p.blocks + " blocks" + (p.regression_href ? " · <a class=\"go\" style=\"font-size:.76rem;margin:0\" href=\"" + esc(p.regression_href) + "\">Regression</a>" : "") + "</div></td>" +
      "<td>" + (p.milestone ? "<div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\"><b>" + esc(p.milestone) + "</b><span class=\"pill " + (p.met ? "ok" : "bad") + "\">" + (p.met ? "ready" : p.checks_ok + " of " + p.checks + " met") + "</span></div>" +
        (p.due ? "<div class=\"small\">due " + esc(p.due) + "</div>" : "") +
        (p.gates && p.gates.total ? "<div class=\"small\">Gates <b>" + p.gates.done + "</b> of " + p.gates.total + " passed" + (p.gates.at_risk ? " · <span class=\"down\">" + p.gates.at_risk + " at risk</span>" : "") + "</div>" : "") +
        (p.failing.length ? "<div class=\"gaps\">Short on: " + p.failing.map(esc).join("; ") + "</div>" : "") : "<span class=\"muted\">none set</span>") + "</td>" +
      "<td><div class=\"rate-cell\"><span class=\"big\">" + pct(p.rate) + "</span><figure class=\"wave compact\" data-wave=\"" + D.projects.indexOf(p) + "\"></figure></div><div class=\"small\">" + p.sims + " sims</div>" + fcPill(p.forecast) + "</td>" +
      "<td class=\"r\"><span class=\"big\">" + p.cov_met + "</span><span class=\"muted\"> / " + p.cov_cells + "</span></td>" +
      "<td class=\"r\"><span class=\"big" + (p.bugs.S1 ? " down" : "") + "\">" + p.bugs.S1 + "</span><span class=\"muted\"> / " + p.bugs.S2 + "</span></td>" +
      "<td class=\"r\"><span class=\"big\">" + (p.tp_items ? pct(p.tp_passing / p.tp_items, 0) : "–") + "</span><div class=\"small\">" + p.tp_passing + " of " + p.tp_items + "</div></td>" +
      "<td><span class=\"mono\">" + esc(p.latest_run) + "</span><div class=\"small\">" + esc(p.latest_date) + "</div>" + (stale ? "<span class=\"pill warn\">" + age + " days old</span>" : "") + "</td>" +
      "</tr>";
  });
  $("portfolio").innerHTML = h + "</tbody>";
  // Each project's run waveform: pass rate per nightly run against its own milestone bar.
  Array.prototype.forEach.call(document.querySelectorAll("[data-wave]"), function (f) {
    var p = D.projects[+f.getAttribute("data-wave")];
    Viz.wave(f, { name: p.name, rates: p.rates, runs: p.runs || [], dates: p.dates || [], need: p.need, compact: true });
  });
  renderOwners();

  /* Quick search: projects and their pages, and owners. */
  Quick.setup(function () {
    var items = [{ kind: "Section", rank: 0, label: "Projects", sub: "Jump to section", go: function () { $("projects-band").scrollIntoView({ block: "start" }); } }];
    if ((D.owners || []).length) items.push({ kind: "Section", rank: 0, label: "Owners", sub: "Jump to section", go: function () { $("owners-band").scrollIntoView({ block: "start" }); } });
    D.projects.forEach(function (p) {
      if (p.error || !p.href) return;
      items.push({ kind: "Project", rank: 1, label: p.name, sub: "Dashboard · " + (p.milestone || "no milestone"), go: function () { location.href = p.href; } });
      if (p.regression_href) items.push({ kind: "Regression", rank: 2, label: p.name, sub: "Subsystem, module and instance drill-down", go: function () { location.href = p.regression_href; } });
    });
    (D.owners || []).forEach(function (r) {
      items.push({ kind: "Owner", rank: 3, label: r.owner, sub: r.project + " · " + r.tp_e + " of " + r.ran_e + " passing", go: function () { location.href = r.href; } });
    });
    return items;
  }, $("top-actions"), "Search projects and owners…");
  $("footer").textContent = "Generated " + D.generated + " by socdash.py build-all. Each project's data and config.json live in its own folder.";
})();
</script>
