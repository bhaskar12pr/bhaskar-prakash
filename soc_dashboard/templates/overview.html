<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/*__CSS__*/
/* Overview: one row per project, same columns as each project's KPI strip, so projects compare down a column. */
.portfolio { min-width: 860px; }
.portfolio td { vertical-align: middle; padding-block: 12px; }
.portfolio a.proj { white-space: nowrap; font: 600 1.05rem var(--font-display); color: var(--ink); text-decoration: none; }
.portfolio a.proj:hover { color: var(--accent); text-decoration: underline; }
.portfolio .big { font: 600 1.25rem/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.portfolio .small { font-size: .76rem; color: var(--muted); }
.portfolio svg { display: block; width: 96px; height: 24px; }
.portfolio tr.err td { background: var(--fail-soft); }
.rate-cell { display: flex; align-items: center; gap: 10px; }
.gaps { font-size: .76rem; color: var(--muted); margin-top: 3px; }
.counts { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: .9rem; color: var(--muted); }
.counts b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
<!--BODY-->
<div class="wrap">
  <header class="top">
    <div style="display:grid;gap:6px">
      <span class="label">SoC verification</span>
      <h1 id="title"></h1>
      <div class="counts" id="counts"></div>
    </div>
  </header>

  <section class="band">
    <div class="band-head"><h2>Projects</h2><p>Each row is the project's whole SoC in its latest run. Open a project for block-level detail.</p></div>
    <div class="panel">
      <div class="scroll"><table class="portfolio" id="portfolio"></table></div>
    </div>
  </section>

  <footer id="footer"></footer>
</div>

<script type="application/json" id="socdash-data">__SOCDASH_DATA__</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("socdash-data").textContent);
  var SVGNS = "http://www.w3.org/2000/svg";
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function pct(x, d) { return x == null ? "–" : (100 * x).toFixed(d == null ? 1 : d) + "%"; }
  function days(a, b) { return Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 864e5); }

  function spark(values) {
    var w = 96, h = 24, v = values.filter(function (x) { return x != null; });
    if (v.length < 2) return "";
    var lo = Math.min.apply(null, v), hi = Math.max.apply(null, v); if (hi - lo < 1e-9) hi = lo + 0.01;
    var pts = values.map(function (x, i) { return x == null ? null : [(i * (w - 6) / (values.length - 1) + 3).toFixed(1), (h - 3 - (x - lo) / (hi - lo) * (h - 6)).toFixed(1)]; }).filter(Boolean);
    var last = pts[pts.length - 1];
    return "<svg viewBox=\"0 0 " + w + " " + h + "\" aria-hidden=\"true\"><path d=\"M" + pts.map(function (p) { return p.join(","); }).join("L") + "\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><circle cx=\"" + last[0] + "\" cy=\"" + last[1] + "\" r=\"2.5\" fill=\"var(--accent)\"/></svg>";
  }

  var today = D.generated.slice(0, 10);
  var ok = D.projects.filter(function (p) { return !p.error && p.met; }).length;
  var bad = D.projects.filter(function (p) { return p.error; }).length;
  var s1 = D.projects.reduce(function (n, p) { return n + (p.bugs ? p.bugs.S1 : 0); }, 0);
  $("title").textContent = D.title;
  $("counts").innerHTML = "<span><b>" + D.projects.length + "</b> project" + (D.projects.length === 1 ? "" : "s") + "</span>" +
    "<span><b>" + ok + "</b> meeting their next milestone</span>" +
    "<span><b>" + s1 + "</b> unresolved S1 bug" + (s1 === 1 ? "" : "s") + "</span>" +
    (bad ? "<span><b>" + bad + "</b> with unreadable inputs</span>" : "");

  var h = "<thead><tr><th>Project</th><th>Next milestone</th><th>Pass rate</th><th class=\"r\">Coverage at target</th><th class=\"r\">S1 / S2 open</th><th class=\"r\">Testplan passing</th><th>Latest run</th></tr></thead><tbody>";
  D.projects.forEach(function (p) {
    if (p.error) {
      h += "<tr class=\"err\"><td><span class=\"proj\" style=\"font:600 1.05rem var(--font-display)\">" + esc(p.name) + "</span></td><td colspan=\"6\"><span class=\"pill bad\">inputs could not be read</span><div class=\"gaps sig\">" + esc(p.error) + "</div></td></tr>";
      return;
    }
    var age = days(p.latest_date, today), stale = age > p.stale_after_days;
    h += "<tr>" +
      "<td><a class=\"proj\" href=\"" + esc(p.href) + "\">" + esc(p.name) + "</a><div class=\"small\">" + p.blocks + " blocks" + (p.regression_href ? " · <a class=\"go\" style=\"font-size:.76rem;margin:0\" href=\"" + esc(p.regression_href) + "\">Regression</a>" : "") + "</div></td>" +
      "<td>" + (p.milestone ? "<div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\"><b>" + esc(p.milestone) + "</b><span class=\"pill " + (p.met ? "ok" : "bad") + "\">" + (p.met ? "ready" : p.checks_ok + " of " + p.checks + " met") + "</span></div>" +
        (p.due ? "<div class=\"small\">due " + esc(p.due) + "</div>" : "") +
        (p.failing.length ? "<div class=\"gaps\">Short on: " + p.failing.map(esc).join("; ") + "</div>" : "") : "<span class=\"muted\">none set</span>") + "</td>" +
      "<td><div class=\"rate-cell\"><span class=\"big\">" + pct(p.rate) + "</span>" + spark(p.rates) + "</div><div class=\"small\">" + p.sims + " sims</div></td>" +
      "<td class=\"r\"><span class=\"big\">" + p.cov_met + "</span><span class=\"muted\"> / " + p.cov_cells + "</span></td>" +
      "<td class=\"r\"><span class=\"big" + (p.bugs.S1 ? " down" : "") + "\">" + p.bugs.S1 + "</span><span class=\"muted\"> / " + p.bugs.S2 + "</span></td>" +
      "<td class=\"r\"><span class=\"big\">" + (p.tp_items ? pct(p.tp_passing / p.tp_items, 0) : "–") + "</span><div class=\"small\">" + p.tp_passing + " of " + p.tp_items + "</div></td>" +
      "<td><span class=\"mono\">" + esc(p.latest_run) + "</span><div class=\"small\">" + esc(p.latest_date) + "</div>" + (stale ? "<span class=\"pill warn\">" + age + " days old</span>" : "") + "</td>" +
      "</tr>";
  });
  $("portfolio").innerHTML = h + "</tbody>";
  $("footer").textContent = "Generated " + D.generated + " by socdash.py build-all. Each project's data and config.json live in its own folder.";
})();
</script>
