# =============================================================================
# GitLab CI/CD for the verification flow (Makefile + scripts/ + project.mk).
# Jobs only call make, so this file is the same for every project.
#
# TO USE AT WORK, change only the block marked "SITE SETTINGS" below:
#   * TOOL_SETUP: commands that put the tools on PATH on your runner
#     (e.g. "module load questa/2024.2"). The default installs the
#     open-source tools in a Docker container, for gitlab.com shared runners.
#   * SIM: your simulator (also settable in project.mk).
#   * Runner tags: uncomment "tags:" under "default:" if your runners need one.
#
# Pipelines
#   push / merge request : lint -> sim (smoke: SEEDS per test), cocotb, formal, synth
#   scheduled (nightly)  : same, but sim runs NIGHTLY_SEEDS random seeds per test
#     (create it in Build > Pipeline schedules; no variables needed)
#   manual run           : Build > Pipelines > Run pipeline; you can set
#                          BLOCKS, TEST, SEEDS, SEED, SIM there
# =============================================================================

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never              # the MR pipeline covers it; avoid two pipelines
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  # ---------------- SITE SETTINGS ----------------
  SIM: icarus
  TOOL_SETUP: >-
    apt-get update -qq &&
    apt-get install -y -qq --no-install-recommends make python3 python3-venv
    iverilog verilator yosys > /dev/null
  # Where pip gets cocotb (set PIP_INDEX_URL to your internal mirror if needed)
  COCOTB_SETUP: >-
    python3 -m venv .venv && . .venv/bin/activate &&
    pip install -q -r requirements.txt
  # ------------------------------------------------
  SEEDS: "1"               # seeds per test on push / MR
  NIGHTLY_SEEDS: "20"      # seeds per test on scheduled pipelines
  JOBS: "4"                # parallel simulations per job
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  DEBIAN_FRONTEND: noninteractive

default:
  image: ubuntu:24.04      # ignored by shell runners
  # tags: [rtl-sim]        # uncomment: run on runners with simulator licences
  interruptible: true
  timeout: 1h
  before_script:
    - eval "$TOOL_SETUP"

stages:
  - check
  - test

.artifacts: &artifacts
  when: always
  expire_in: 1 week
  paths:
    - build/*/*.log
    - build/*/sim/*/sim.log
    - build/*/sim/*/*.vcd
    - build/*/junit_*.xml
  reports:
    junit: build/*/junit_*.xml

selftest:
  stage: check
  script:
    - make selftest

lint:
  stage: check
  script:
    - make check-env STAGES="lint sim formal synth"
    - make lint
  artifacts: *artifacts

sim:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables:
        SEEDS: $NIGHTLY_SEEDS
        RANDOM_SEEDS: "1"
    - when: on_success
  script:
    - make -k sim
  artifacts: *artifacts

cocotb:
  stage: test
  cache:
    key: pip-$CI_JOB_NAME
    paths: [.cache/pip]
  script:
    - eval "$COCOTB_SETUP"
    - make -k cocotb
  artifacts: *artifacts

formal:
  stage: test
  script:
    - make -k formal
  artifacts: *artifacts

synth:
  stage: test
  script:
    - make -k synth
  artifacts: *artifacts
