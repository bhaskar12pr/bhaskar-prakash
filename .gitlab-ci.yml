# GitLab CI/CD pipeline for the RTL in rtl/ and testbenches in tb/.
# Mirrors .github/workflows/ci.yml: both just call the Makefile.
#
#   lint ──┬─► simulate   Verilog testbenches on Icarus  (MR "Tests" tab)
#          ├─► cocotb     Python testbenches on Icarus   (MR "Tests" tab)
#          ├─► formal     Yosys SAT proof of the assertions in formal/
#          └─► synth      Yosys synthesis, fails on latches

# Run for merge requests, for the default branch and tags, and for branches
# without an open MR. This avoids two pipelines for one push to an MR branch.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

image: ubuntu:24.04

stages:
  - lint
  - test

variables:
  DEBIAN_FRONTEND: noninteractive
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip

default:
  interruptible: true    # a newer pipeline on the same branch cancels this one
  timeout: 15m

.install: &install
  - apt-get update -qq
  - apt-get install -y -qq --no-install-recommends make python3 $TOOLS > /dev/null

lint:
  stage: lint
  variables:
    TOOLS: iverilog verilator
  script:
    - *install
    - make lint

simulate:
  stage: test
  variables:
    TOOLS: iverilog
  script:
    - *install
    - make -k sim
  after_script:
    - make junit || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/*.log
      - build/*.vcd
    reports:
      junit: build/junit.xml

cocotb:
  stage: test
  variables:
    TOOLS: iverilog python3-venv
  cache:
    key: pip-$CI_JOB_NAME
    paths:
      - .cache/pip
  script:
    - *install
    - python3 -m venv .venv
    - . .venv/bin/activate
    - pip install -q -r requirements.txt
    - make cocotb
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/cocotb_results.xml
    reports:
      junit: build/cocotb_results.xml

formal:
  stage: test
  variables:
    TOOLS: yosys
  script:
    - *install
    - make -k formal
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/formal_*.log

synth:
  stage: test
  variables:
    TOOLS: yosys
  script:
    - *install
    - make synth
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/synth_*
