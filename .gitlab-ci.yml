# GitLab CI/CD pipeline for the RTL in rtl/ and testbenches in tb/.
# Mirrors .github/workflows/ci.yml: both just call the Makefile.
#
#   lint ──┬─► simulate   (Icarus testbenches + JUnit report in the MR "Tests" tab)
#          └─► synth      (Yosys generic synthesis, latch check)

image: ubuntu:24.04

stages:
  - lint
  - test

variables:
  DEBIAN_FRONTEND: noninteractive

.install: &install
  - apt-get update -qq
  - apt-get install -y -qq --no-install-recommends make python3 $TOOLS > /dev/null

lint:
  stage: lint
  variables:
    TOOLS: iverilog verilator
  script:
    - *install
    - make lint

simulate:
  stage: test
  variables:
    TOOLS: iverilog
  script:
    - *install
    - make -k sim
  after_script:
    - make junit || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/*.log
      - build/*.vcd
    reports:
      junit: build/junit.xml

synth:
  stage: test
  variables:
    TOOLS: yosys
  script:
    - *install
    - make synth
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/synth_*
