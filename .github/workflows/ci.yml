# GitHub Actions for the verification flow. Mirrors .gitlab-ci.yml: jobs only
# call make, and the project-specific settings live in project.mk.

name: RTL CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"     # nightly: random seeds, NIGHTLY_SEEDS per test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SIM: icarus
  SEEDS: ${{ github.event_name == 'schedule' && '20' || '1' }}
  RANDOM_SEEDS: ${{ github.event_name == 'schedule' && '1' || '0' }}
  APT_TOOLS: make iverilog verilator yosys

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests of the flow scripts
        run: make selftest

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq $APT_TOOLS
      - run: make check-env STAGES="lint sim formal synth"
      - run: make lint

  test:
    needs: [selftest, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        stage: [sim, cocotb, formal, synth]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.stage == 'cocotb'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq $APT_TOOLS
          if [ "${{ matrix.stage }}" = cocotb ]; then pip install -r requirements.txt; fi
      - name: make ${{ matrix.stage }}
        run: make -k ${{ matrix.stage }}
      - name: Report
        if: always() && (matrix.stage == 'sim' || matrix.stage == 'cocotb')
        run: python3 scripts/junit_summary.py "build/*/junit_${{ matrix.stage }}.xml" --title "${{ matrix.stage }} results" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.stage }}-logs
          path: |
            build/*/*.log
            build/*/sim/*/sim.log
            build/*/sim/*/*.vcd
            build/*/junit_*.xml
          if-no-files-found: ignore
          retention-days: 7
