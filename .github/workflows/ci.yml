# GitHub Actions pipeline for the RTL in rtl/ and testbenches in tb/.
# Mirrors .gitlab-ci.yml: both just call the Makefile, so moving to GitLab
# later needs no changes to the flow.
#
#   lint ──┬─► simulate   (Icarus testbenches + JUnit report)
#          └─► synth      (Yosys generic synthesis, latch check)

name: RTL CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog verilator
      - name: Lint (Verilator + Icarus)
        run: make lint

  simulate:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
      - name: Run testbenches
        run: make -k sim
      - name: Test report
        if: always()
        run: python3 scripts/logs_to_junit.py tb/tb_*.v --out build/junit.xml --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload logs and waveforms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation
          path: |
            build/*.log
            build/*.vcd
            build/junit.xml
          retention-days: 7

  synth:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq yosys
      - name: Synthesize (Yosys)
        run: make synth
      - name: Upload synthesis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthesis
          path: build/synth_*
          retention-days: 7
